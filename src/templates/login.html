<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Goal Championship</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
    }
    .form-container {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="text-center mb-4">
      <h1 class="h3 mb-3 fw-normal text-light">Goal Championship</h1>
    </div>
    <form method="POST" action="/account/login" class="p-4 bg-dark rounded shadow border border-secondary">
      <div class="mb-3">
        <label for="source" class="form-label text-light">Service Source</label>
        <select class="form-select bg-secondary text-light border-0" id="source" name="source" required>
          <option value="" selected disabled>Please select the source</option>
          <option value="Notion">Notion</option>
          <option value="Todoist">Todoist</option>
          <option value="Zenkit">Zenkit</option>
        </select>
      </div>
      <div class="mb-4">
        <label for="token" class="form-label text-light">API Token</label>
        <input type="password" class="form-control bg-secondary text-light border-0" id="token" name="token"
          placeholder="Please type the token" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
